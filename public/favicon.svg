  <!-- Lock / Keyhole Icon in Center -->
  <rect x="23" y="27" width="18" height="15" rx="3" fill="url(#goldGrad)"/>
  <path d="M26 27V22C26 18.7 28.7 16 32 16C35.3 16 38 18.7 38 22V27" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Keyhole dot & slot -->
  <circle cx="32" cy="33" r="2" fill="#1E293B"/>
  <path d="M32 34V38" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
</svg>
